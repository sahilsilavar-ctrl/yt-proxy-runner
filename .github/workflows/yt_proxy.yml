name: YouTube Upload Proxy

on:
  workflow_dispatch:
    inputs:
      profile_id:
        description: 'Profile ID for isolated proxy'
        required: true
        default: 'default'

permissions:
  contents: write

jobs:
  proxy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install microsocks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq microsocks
          microsocks -p 1080 -i 0.0.0.0 &
          sleep 1

      - name: Start Pinggy TCP Tunnel
        run: |
          PUBLIC_IP=$(curl -s https://api.ipify.org)
          echo "GitHub Runner Public IP: $PUBLIC_IP"
          PROFILE_ID="${{ github.event.inputs.profile_id }}"
          if [ -z "$PROFILE_ID" ]; then
            PROFILE_ID="default"
          fi
          echo "Allocating proxy for profile: $PROFILE_ID"
          
          ssh -p 443 -R0:localhost:1080 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 -o UserKnownHostsFile=/dev/null tcp@a.pinggy.io > pinggy.log 2>&1 &
          
          echo "Waiting for Pinggy tunnel..."
          for i in {1..25}; do
            sleep 2
            URL=$(grep -oE "tcp://[a-zA-Z0-9.-]+:[0-9]+" pinggy.log | head -n 1 || true)
            if [ -n "$URL" ]; then
              PROXY_ADDR=$(echo "$URL" | sed 's|tcp://||')
              echo "FOUND_PROXY: $PROXY_ADDR for profile $PROFILE_ID"
              
              git config user.name "GitHub Actions"
              git config user.email "actions@github.com"
              
              git fetch origin active_proxy || true
              git checkout active_proxy 2>/dev/null || git checkout -b active_proxy
              
              mkdir -p proxies
              cat <<EOF > "proxies/${PROFILE_ID}.json"
{
  "profile_id": "$PROFILE_ID",
  "proxy": "$PROXY_ADDR",
  "ip": "$PUBLIC_IP",
  "timestamp": $(date +%s)
}
EOF
              
              cp "proxies/${PROFILE_ID}.json" proxy.json
              
              git add proxies/ proxy.json
              git commit -m "Update proxy for ${PROFILE_ID} [skip ci]" || true
              
              for push_retry in {1..5}; do
                git pull origin active_proxy --rebase || true
                if git push origin active_proxy; then
                  echo "Successfully published proxy for ${PROFILE_ID}!"
                  break
                fi
                sleep 2
              done
              break
            fi
          done

      - name: Keep Alive
        run: |
          echo "Proxy is running and ready for traffic!"
          while true; do
            sleep 30
          done
